name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pytest fastapi httpx python-multipart python-dotenv
      - name: Compile application modules
        run: python -m compileall -q backend frontend tests
      - name: Run unit tests
        run: python -m pytest -q
